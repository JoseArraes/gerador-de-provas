<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Corretor de Provas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3355; --navy-2:#2A4A73; --blue:#3E7CB8; --blue-light:#EAF2FA; --blue-border:#4A90C4;
    --ink:#1F2937; --ink-soft:#5B6470; --paper:#FFFFFF; --canvas:#F3F5F8; --line:#E1E6ED;
    --green:#1C8A5C; --green-bg:#E6F7EE; --red:#C13B2E; --red-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Source Sans 3', sans-serif; background:var(--canvas); color:var(--ink); padding:40px 16px 80px;}
  .wrap{max-width:840px; margin:0 auto;}
  .tag{display:inline-block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--blue); background:var(--blue-light); padding:3px 9px; border-radius:20px; margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:26px; color:var(--navy); margin:0 0 24px;}

  .card{background:var(--paper); border-radius:14px; box-shadow:0 1px 3px rgba(20,30,50,.06), 0 12px 32px rgba(20,30,50,.05); padding:28px 32px; margin-bottom:22px;}
  .card h2{font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--navy); margin:0 0 16px;}

  .upload-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:640px){.upload-grid{grid-template-columns:1fr;}}
  .upload-box{border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; cursor:pointer; transition:border-color .15s ease, background .15s ease;}
  .upload-box:hover{border-color:var(--blue-border); background:var(--blue-light);}
  .upload-box input{display:none;}
  .upload-icon{font-size:26px; margin-bottom:6px;}
  .upload-label{font-weight:600; font-size:14px; color:var(--navy); margin-bottom:3px;}
  .upload-sub{font-size:12px; color:var(--ink-soft);}
  .upload-box.filled{border-color:var(--green); background:var(--green-bg);}
  .upload-box.filled .upload-label{color:var(--green);}

  .btnrow{margin-top:20px; display:flex; gap:10px;}
  button{font-family:inherit; font-weight:600; font-size:14px; border:none; border-radius:8px; padding:12px 20px; cursor:pointer;}
  .btn-primary{background:var(--navy); color:#fff; flex:1;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-primary:disabled{background:#B9C2CE; cursor:not-allowed;}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--line);}
  .status{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}
  .status.err{color:var(--red);}
  .status.warn{color:#B9791E;}

  .result-card{background:var(--paper); border-radius:14px; box-shadow:0 1px 3px rgba(20,30,50,.06), 0 12px 32px rgba(20,30,50,.05); padding:0; margin-bottom:22px; overflow:hidden;}
  .result-head{padding:22px 32px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;}
  .result-name{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; color:var(--navy);}
  .result-sub{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .stat-row{display:flex; gap:22px;}
  .stat{text-align:center;}
  .stat-num{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700;}
  .stat-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
  .stat.acertos .stat-num{color:var(--green);}
  .stat.erros .stat-num{color:var(--red);}
  .stat.nota .stat-num{color:var(--navy); font-size:26px;}

  table{width:100%; border-collapse:collapse;}
  th, td{text-align:left; padding:11px 32px; font-size:13.5px;}
  thead th{background:#F7F9FB; color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line);}
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  .r-ok{color:var(--green); font-weight:700;}
  .r-err{color:var(--red); font-weight:700;}
  .cell-resp{font-weight:600;}
  .cell-resp.wrong{color:var(--red);}
  .cell-resp.right{color:var(--green);}
  .cell-resp.empty{color:var(--ink-soft); font-style:italic; font-weight:400;}

  .summary-table{margin-top:0;}
  .empty-hint{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:30px;}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Fase 3 · Corretor</span>
  <h1>Corretor de Provas</h1>

  <div class="card">
    <h2>1. Selecione os arquivos</h2>
    <div class="upload-grid">
      <label class="upload-box" id="box-gabarito">
        <input type="file" id="input-gabarito" accept=".json">
        <div class="upload-icon">📁</div>
        <div class="upload-label" id="label-gabarito">Gabarito</div>
        <div class="upload-sub" id="sub-gabarito">gabarito.json</div>
      </label>
      <label class="upload-box" id="box-respostas">
        <input type="file" id="input-respostas" accept=".json" multiple>
        <div class="upload-icon">📁</div>
        <div class="upload-label" id="label-respostas">Resposta(s) do aluno</div>
        <div class="upload-sub" id="sub-respostas">pode selecionar várias de uma vez</div>
      </label>
    </div>
    <div class="btnrow">
      <button class="btn-primary" id="btn-corrigir" onclick="corrigir()" disabled>Corrigir</button>
      <button class="btn-ghost" onclick="limpar()">Limpar</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="summary-wrap"></div>
  <div id="results-wrap"></div>
</div>

<script>
let gabarito = null;
let respostasFiles = [];

document.getElementById('input-gabarito').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const json = JSON.parse(text);
    if(!json.questions){ throw new Error('formato inválido'); }
    gabarito = json;
    document.getElementById('box-gabarito').classList.add('filled');
    document.getElementById('label-gabarito').textContent = json.title || 'Gabarito carregado';
    document.getElementById('sub-gabarito').textContent = `${json.questions.length} questões`;
  }catch(err){
    setStatus('Não consegui ler o gabarito. Confira se é o arquivo gabarito.json correto.', 'err');
    gabarito = null;
  }
  updateButton();
});

document.getElementById('input-respostas').addEventListener('change', (e)=>{
  respostasFiles = Array.from(e.target.files);
  document.getElementById('box-respostas').classList.toggle('filled', respostasFiles.length > 0);
  document.getElementById('label-respostas').textContent = respostasFiles.length
    ? `${respostasFiles.length} arquivo(s) selecionado(s)`
    : 'Resposta(s) do aluno';
  document.getElementById('sub-respostas').textContent = respostasFiles.length
    ? respostasFiles.map(f=>f.name).join(', ')
    : 'pode selecionar várias de uma vez';
  updateButton();
});

function updateButton(){
  document.getElementById('btn-corrigir').disabled = !(gabarito && respostasFiles.length);
}

function setStatus(msg, type){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' '+type : '');
}

function limpar(){
  gabarito = null; respostasFiles = [];
  document.getElementById('input-gabarito').value = '';
  document.getElementById('input-respostas').value = '';
  document.getElementById('box-gabarito').classList.remove('filled');
  document.getElementById('box-respostas').classList.remove('filled');
  document.getElementById('label-gabarito').textContent = 'Gabarito';
  document.getElementById('sub-gabarito').textContent = 'gabarito.json';
  document.getElementById('label-respostas').textContent = 'Resposta(s) do aluno';
  document.getElementById('sub-respostas').textContent = 'pode selecionar várias de uma vez';
  document.getElementById('summary-wrap').innerHTML = '';
  document.getElementById('results-wrap').innerHTML = '';
  setStatus('');
  updateButton();
}

async function corrigir(){
  setStatus('Corrigindo...', '');
  const letters = ['A','B','C','D','E','F'];
  const totalPeso = gabarito.questions.reduce((s,q)=> s + (q.peso || 1), 0);
  const allResults = [];
  let anyMismatch = false;

  for(const file of respostasFiles){
    let json;
    try{
      json = JSON.parse(await file.text());
    }catch(err){ continue; }

    if(gabarito.quizId && json.quizId && gabarito.quizId !== json.quizId){
      anyMismatch = true;
    }

    let acertos = 0, achievedPeso = 0;
    const rows = gabarito.questions.map((q, qi)=>{
      const alunoIdx = json.answers ? json.answers[qi] : null;
      const correta = q.correct;
      const isRight = alunoIdx !== null && alunoIdx !== undefined && alunoIdx === correta;
      if(isRight){ acertos++; achievedPeso += (q.peso || 1); }
      return {
        num: qi+1,
        alunoLetra: (alunoIdx === null || alunoIdx === undefined) ? null : letters[alunoIdx],
        corretaLetra: letters[correta],
        isRight
      };
    });
    const total = gabarito.questions.length;
    const erros = total - acertos;
    const nota = totalPeso > 0 ? (achievedPeso / totalPeso) * 10 : 0;

    allResults.push({
      studentName: json.studentName || 'Aluno sem nome',
      studentNumero: json.studentNumero || '',
      studentTurma: json.studentTurma || '',
      acertos, erros, total, nota, rows
    });
  }

  renderResults(allResults, gabarito.title || '');
  setStatus(anyMismatch ? 'Atenção: alguma resposta parece ser de outra prova (quizId diferente). Resultados exibidos mesmo assim.' : `Correção concluída — ${allResults.length} aluno(s).`, anyMismatch ? 'warn' : '');
}

function notaColor(nota){
  if(nota >= 7) return 'var(--green)';
  if(nota >= 5) return '#B9791E';
  return 'var(--red)';
}

function renderResults(results, provaTitle){
  const summaryWrap = document.getElementById('summary-wrap');
  const resultsWrap = document.getElementById('results-wrap');

  if(results.length === 0){
    summaryWrap.innerHTML = '';
    resultsWrap.innerHTML = '<div class="card empty-hint">Nenhum resultado para mostrar.</div>';
    return;
  }

  if(results.length > 1){
    summaryWrap.innerHTML = `
      <div class="card summary-table" style="padding:0;">
        <div style="padding:22px 32px 4px;"><h2 style="margin:0;">Resumo da turma — ${escapeHTML(provaTitle)}</h2></div>
        <table>
          <thead><tr><th>Aluno</th><th>Turma</th><th>Acertos</th><th>Erros</th><th>Nota</th></tr></thead>
          <tbody>
            ${results.map(r => `
              <tr>
                <td>${escapeHTML(r.studentName)}</td>
                <td>${escapeHTML(r.studentTurma)}</td>
                <td>${r.acertos}/${r.total}</td>
                <td>${r.erros}</td>
                <td style="font-weight:700; color:${notaColor(r.nota)}">${r.nota.toFixed(1)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } else {
    summaryWrap.innerHTML = '';
  }

  resultsWrap.innerHTML = results.map(r => `
    <div class="result-card">
      <div class="result-head">
        <div>
          <div class="result-name">${escapeHTML(r.studentName)}</div>
          <div class="result-sub">${r.studentTurma ? 'Turma '+escapeHTML(r.studentTurma)+' · ' : ''}${r.studentNumero ? 'Nº '+escapeHTML(r.studentNumero) : ''}</div>
        </div>
        <div class="stat-row">
          <div class="stat acertos"><div class="stat-num">${r.acertos}</div><div class="stat-label">Acertos</div></div>
          <div class="stat erros"><div class="stat-num">${r.erros}</div><div class="stat-label">Erros</div></div>
          <div class="stat nota"><div class="stat-num" style="color:${notaColor(r.nota)}">${r.nota.toFixed(1)}</div><div class="stat-label">Nota</div></div>
        </div>
      </div>
      <table>
        <thead><tr><th>Questão</th><th>Aluno</th><th>Correta</th><th>Resultado</th></tr></thead>
        <tbody>
          ${r.rows.map(row => `
            <tr>
              <td>${row.num}</td>
              <td class="cell-resp ${row.alunoLetra===null ? 'empty' : (row.isRight ? 'right':'wrong')}">${row.alunoLetra ?? '— não respondida —'}</td>
              <td>${row.corretaLetra}</td>
              <td class="${row.isRight ? 'r-ok':'r-err'}">${row.isRight ? '✅' : '❌'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `).join('');
}

function escapeHTML(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
</script>
</body>
</html>
